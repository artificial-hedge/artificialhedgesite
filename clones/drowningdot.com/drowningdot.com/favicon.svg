<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="drowningdot">
  <!-- No plate. The mark used to sit on a #0D0D0C rounded rect, which read as a
       frame around the icon in the tab strip. Dropping it means the upper half
       has to survive both a light and a dark tab bar on its own, so it flips on
       prefers-color-scheme — the same trick the nav mark plays with currentColor.
       The red half is constant: it clears both grounds without help. -->
  <!-- Light is the DEFAULT and dark is the media query, which is the way round
       that looks backwards. Safari's support for prefers-color-scheme inside a
       favicon is unreliable, and a browser that ignores the query falls back to
       whatever sits outside it. Defaulting light means the fallback is a pale
       half on a dark tab bar — legible. The other way round put a #0D0D0C half
       on a dark bar, which is nothing at all. -->
  <style>
    .top { fill: #EAE8E1 }
    @media (prefers-color-scheme: light) { .top { fill: #0D0D0C } }
  </style>
  <defs><clipPath id="under"><rect x="0" y="16" width="32" height="16"/></clipPath></defs>
  <!-- r grows 8.2 -> 12 now that there is no plate to sit inside; at a 16px
       render the old radius left the mark floating in dead space. -->
  <circle class="top" cx="16" cy="16" r="12"/>
  <circle cx="16" cy="16" r="12" fill="#C33F27" clip-path="url(#under)"/>
</svg>
